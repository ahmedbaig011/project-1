<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova Gallery</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet"><style>:root{--ink:#17151e;--cream:#faf7f1;--purple:#7054f6;--pink:#ff739f}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Manrope,sans-serif}nav,main{max-width:1100px;margin:auto;padding-left:36px;padding-right:36px}nav{height:92px;display:flex;align-items:center;justify-content:space-between}.logo{color:var(--ink);font-size:22px;font-weight:800;letter-spacing:-1.6px;text-decoration:none}.logo i{display:inline-block;width:14px;height:14px;margin-right:9px;background:var(--purple);border-radius:4px 4px 4px 0;transform:rotate(45deg)}.links{display:flex;gap:28px;font-size:13px;font-weight:700}.links a{color:var(--ink);text-decoration:none}.links a[aria-current]{color:var(--purple)}main{padding-top:57px;padding-bottom:70px}.eyebrow{font:500 11px 'DM Mono';letter-spacing:.1em;text-transform:uppercase;color:var(--purple)}h1{max-width:700px;margin:15px 0 45px;font-size:clamp(48px,8vw,88px);line-height:.96;letter-spacing:-.075em}h1 em{font-family:'Playfair Display';font-weight:600;color:var(--purple)}.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:180px;gap:16px}.tile{position:relative;overflow:hidden;border-radius:20px;padding:20px;color:white;display:flex;align-items:end;box-shadow:inset 0 -70px 70px #0003}.tile:before{content:"";position:absolute;inset:0;background:var(--bg);transition:.35s}.tile:hover:before{transform:scale(1.08)}.tile>*{position:relative}.tile:nth-child(1){--bg:linear-gradient(135deg,#ff8ab0,#a272f8);grid-column:span 2}.tile:nth-child(2){--bg:linear-gradient(135deg,#342554,#7054f6);grid-row:span 2}.tile:nth-child(3){--bg:linear-gradient(135deg,#f7bc77,#fa6e9d)}.tile:nth-child(4){--bg:linear-gradient(135deg,#347d83,#b3e19e)}.tile:nth-child(5){--bg:linear-gradient(135deg,#482d7c,#fb8cc0);grid-column:span 2}.tile small{display:block;font:500 10px 'DM Mono';letter-spacing:.08em}.tile h2{margin:5px 0 0;font-size:22px;letter-spacing:-.06em}@media(max-width:620px){nav,main{padding-left:22px;padding-right:22px}.links{gap:16px}.grid{grid-template-columns:1fr 1fr;grid-auto-rows:155px}.tile:nth-child(1),.tile:nth-child(5){grid-column:span 2}}</style></head><body><nav><a class="logo" href="index.html"><i></i>NOVA</a><div class="links"><a href="index.html">Home</a><a href="about.html">About</a><a href="gallery.html" aria-current="page">Gallery</a><a href="contact.html">Contact</a></div></nav><main><div class="eyebrow">Selected moments</div><h1>Little worlds, <em>made visible.</em></h1><section class="grid"><article class="tile"><div><small>01 / EDITORIAL</small><h2>Soft focus</h2></div></article><article class="tile"><div><small>02 / IDENTITY</small><h2>Orbit</h2></div></article><article class="tile"><div><small>03 / DIGITAL</small><h2>Sunlit system</h2></div></article><article class="tile"><div><small>04 / OBJECTS</small><h2>Still life</h2></div></article><article class="tile"><div><small>05 / PLAY</small><h2>Afterglow</h2></div></article></section></main></body></html>
