<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact Nova</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet"><style>:root{--ink:#17151e;--cream:#faf7f1;--purple:#7054f6;--pink:#ff739f}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Manrope,sans-serif}.shape{position:fixed;width:38vw;height:38vw;border-radius:50%;background:#ffd6e5;left:-16vw;bottom:-16vw;z-index:-1}nav,main{max-width:1100px;margin:auto;padding-left:36px;padding-right:36px}nav{height:92px;display:flex;align-items:center;justify-content:space-between}.logo{color:var(--ink);font-size:22px;font-weight:800;letter-spacing:-1.6px;text-decoration:none}.logo i{display:inline-block;width:14px;height:14px;margin-right:9px;background:var(--purple);border-radius:4px 4px 4px 0;transform:rotate(45deg)}.links{display:flex;gap:28px;font-size:13px;font-weight:700}.links a{color:var(--ink);text-decoration:none}.links a[aria-current]{color:var(--purple)}main{display:grid;grid-template-columns:1fr 1fr;gap:70px;padding-top:68px;padding-bottom:70px}.eyebrow{font:500 11px 'DM Mono';letter-spacing:.1em;text-transform:uppercase;color:var(--purple)}h1{margin:16px 0 20px;font-size:clamp(48px,7vw,82px);line-height:.96;letter-spacing:-.075em}h1 em{font-family:'Playfair Display';font-weight:600;color:var(--purple)}.lead{color:#625d68;line-height:1.7;font-size:17px}.details{margin-top:38px;font:500 12px 'DM Mono';line-height:2.1}.form{padding:29px;border-radius:22px;background:#fff;border:1px solid #ece5dd;box-shadow:0 20px 45px #211a3210}label{display:block;margin:0 0 6px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}input,textarea{width:100%;margin-bottom:18px;padding:13px;border:1px solid #e2dce8;border-radius:10px;background:#fcfbf8;font:14px Manrope;outline-color:var(--purple)}textarea{height:112px;resize:vertical}.send{border:0;border-radius:999px;padding:15px 22px;background:var(--purple);color:#fff;font:700 13px Manrope;box-shadow:0 6px 0 #4430b6;cursor:pointer}@media(max-width:620px){nav,main{padding-left:22px;padding-right:22px}.links{gap:16px}main{grid-template-columns:1fr;gap:30px;padding-top:48px}}</style></head><body><div class="shape"></div><nav><a class="logo" href="index.html"><i></i>NOVA</a><div class="links"><a href="index.html">Home</a><a href="about.html">About</a><a href="gallery.html">Gallery</a><a href="contact.html" aria-current="page">Contact</a></div></nav><main><section><div class="eyebrow">Start a conversation</div><h1>Let’s make something <em>lovely.</em></h1><p class="lead">A question, a spark, or a project waiting for its next chapter—we’d love to hear from you.</p><div class="details">HELLO@NOVASTUDIO.COM<br>LOS ANGELES · CALIFORNIA</div></section><form class="form" onsubmit="event.preventDefault(); this.querySelector('button').textContent='Message sent ✦';"><label for="name">Your name</label><input id="name" required placeholder="Jane Smith"><label for="email">Email address</label><input id="email" type="email" required placeholder="jane@example.com"><label for="message">What’s on your mind?</label><textarea id="message" required placeholder="Tell us a little about it..."></textarea><button class="send" type="submit">Send a note →</button></form></main></body></html>
